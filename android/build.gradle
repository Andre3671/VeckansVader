// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Defined here (not in variables.gradle) because variables.gradle is
    // applied AFTER this buildscript block runs, so its values aren't
    // visible to the classpath dependencies declared here.
    // Capacitor 8 plugins compile against Kotlin 2.0+.
    ext.kotlinVersion = '2.0.21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
