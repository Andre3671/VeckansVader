# Automated dependency PRs. GitHub native — no workflow needed.
#
# Each ecosystem below is scanned on schedule. When a new version is
# released (or a CVE patch ships) Dependabot opens a PR against `main`
# with the bump + changelog. You merge or close.

version: 2
updates:
  # ── npm ────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    # Group all minor + patch updates into a single PR per week to reduce
    # noise. Majors still get their own PR for individual review.
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Skip the @capacitor/* packages — they need to be bumped together
    # with @capacitor/cli and the Android project, which we handle
    # manually when we want to upgrade Capacitor itself.
    ignore:
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
      include: "scope"

  # ── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"

  # ── Dockerfile ─────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "docker"
